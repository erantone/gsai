<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Intelligent Autonomous Systems Group (GSAI)</title>
<style>
    :root {
      --bg: #0b1220;
      --panel: #111a2e;
      --panel-2: #16213b;
      --text: #e8eefc;
      --muted: #a9b7d7;
      --line: rgba(255,255,255,.08);
      --accent: #61dafb;
      --accent-2: #8cffc1;
      --max: 1180px;
      --shadow: 0 18px 40px rgba(0,0,0,.28);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(97,218,251,.14), transparent 30%),
        radial-gradient(circle at 90% 10%, rgba(140,255,193,.10), transparent 28%),
        linear-gradient(180deg, #08101d 0%, #0b1220 100%);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { width: min(var(--max), calc(100% - 32px)); margin: 0 auto; }
    .nav {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(12px);
      background: rgba(8, 16, 29, .72);
      border-bottom: 1px solid var(--line);
    }
    .nav .inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 24px; padding: 14px 0;
    }
    .brand { font-weight: 800; letter-spacing: .2px; color: white; }
    .menu { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; }
    .hero {
      padding: 88px 0 56px;
    }
    .hero-grid {
      display: grid; grid-template-columns: 1.2fr .8fr; gap: 26px; align-items: stretch;
    }
    .hero-card, .side-card, .section-card {
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .hero-card { padding: 34px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid rgba(97,218,251,.24);
      color: var(--accent);
      background: rgba(97,218,251,.08);
      border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600;
    }
    h1 {
      font-size: clamp(2.2rem, 5vw, 4.2rem);
      line-height: 1.05;
      margin: 18px 0 16px;
      letter-spacing: -.03em;
    }
    .lead {
      font-size: 1.08rem;
      color: var(--muted);
      max-width: 62ch;
    }
    .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 18px; border-radius: 999px; font-weight: 700;
      border: 1px solid var(--line);
      transition: transform .2s ease, opacity .2s ease;
    }
    .btn:hover { transform: translateY(-1px); text-decoration: none; }
    .btn.primary {
      background: linear-gradient(135deg, var(--accent), #7dc9ff);
      color: #07131f; border: none;
    }
    .btn.secondary {
      background: rgba(255,255,255,.03); color: var(--text);
    }
    .side-card {
      padding: 26px;
      display: grid; gap: 16px;
    }
    .metric {
      padding: 16px 18px; border-radius: 18px;
      background: rgba(255,255,255,.025);
      border: 1px solid var(--line);
    }
    .metric strong { display:block; font-size: 1.55rem; }
    section { padding: 18px 0 32px; }
    .section-head {
      display: flex; justify-content: space-between; align-items: end; gap: 18px;
      margin-bottom: 18px;
    }
    .section-head h2 { font-size: clamp(1.55rem, 3vw, 2.4rem); margin: 0; }
    .section-head p { margin: 0; color: var(--muted); max-width: 64ch; }
    .section-card { padding: 26px; }
    .pillars {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px;
    }
    .pillar {
      padding: 22px; border-radius: 20px;
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border: 1px solid var(--line);
    }
    .pillar h3 { margin-top: 0; margin-bottom: 10px; font-size: 1.35rem; }
    .pillar ul { margin: 10px 0 0 18px; color: var(--muted); }
    .news-card {
      padding: 22px; border-radius: 20px; border: 1px solid rgba(140,255,193,.15);
      background: linear-gradient(180deg, rgba(140,255,193,.08), rgba(97,218,251,.04));
    }
    .news-card .label {
      display: inline-block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--accent-2); font-weight: 800; margin-bottom: 10px;
    }
    .news-meta {
      display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-top: 18px;
    }
    .news-meta .box {
      padding: 14px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid var(--line);
      font-size: 14px;
    }
    .grid-3 {
      display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px;
    }
    .member-card {
      background: rgba(255,255,255,.025);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
    }
    .member-card h3 { margin: 14px 0 4px; font-size: 1.15rem; }
    .member-card .role { color: var(--accent); font-weight: 700; margin: 0 0 8px; }
    .member-card p { color: var(--muted); margin: 0; }
    .avatar {
      width: 200px; aspect-ratio: 1 / 1; object-fit: cover;
      border-radius: 18px; background: #1d2740; border: 1px solid var(--line);
      margin: 0 auto; display: block;
    }
    .avatar.placeholder {
      display: grid; place-items: center;
      font-size: 2rem; font-weight: 800; color: white;
      background: linear-gradient(135deg, #273555, #16213b);
    }
    .pub-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;
    }
    .pub-item {
      padding: 18px; border-radius: 20px; border: 1px solid var(--line); background: rgba(255,255,255,.025);
    }
    .pub-item h4 { margin: 10px 0 6px; font-size: 1.03rem; }
    .pub-item p { margin: 0; color: var(--muted); }
    .tag {
      display: inline-flex; padding: 6px 10px; border-radius: 999px;
      background: rgba(97,218,251,.10); color: var(--accent); font-weight: 700; font-size: 12px;
      border: 1px solid rgba(97,218,251,.18);
    }
    .media-card {
      display: grid; grid-template-columns: 1.1fr .9fr; gap: 20px; align-items: center;
      padding: 22px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
    }
    .media-preview {
      min-height: 240px;
      border-radius: 20px;
      background:
        linear-gradient(135deg, rgba(97,218,251,.18), rgba(140,255,193,.08)),
        radial-gradient(circle at 30% 25%, rgba(255,255,255,.12), transparent 26%),
        #0d1627;
      border: 1px solid var(--line);
      display: grid; place-items: center; text-align: center; padding: 18px;
    }
    .media-preview strong { font-size: 1.3rem; max-width: 18ch; }
    .alumni-list {
      columns: 2; gap: 24px; padding-left: 18px; margin: 0;
    }
    .alumni-list li { break-inside: avoid; margin-bottom: 14px; color: var(--muted); }
    .muted { color: var(--muted); }
    .footer {
      padding: 28px 0 54px; color: var(--muted); font-size: 14px;
    }
    @media (max-width: 980px) {
      .hero-grid, .pillars, .grid-3, .pub-grid, .media-card, .news-meta {
        grid-template-columns: 1fr;
      }
      .alumni-list { columns: 1; }
    }
    @media (max-width: 720px) {
      .nav .inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 0 10px;
      }
      .menu {
        display: flex;
        width: 100%;
        flex-wrap: nowrap;
        gap: 16px;
        overflow-x: auto;
        white-space: nowrap;
        padding: 2px 0 5px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .menu::-webkit-scrollbar { display: none; }
      .hero-card, .side-card, .section-card { padding: 22px; }
      .hero { padding-top: 48px; }
    }
  

    .video-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .video-card{padding:0;overflow:hidden}
    .video-embed{aspect-ratio:16/9;width:100%;border:0;display:block;background:#000}
    .video-content{padding:18px 20px 20px}
    .video-content h3{margin:0 0 8px}
    .video-meta{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
    .video-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .video-links a{display:inline-flex;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.025);font-size:12px;font-weight:700}
    .video-links a:hover{text-decoration:none;background:rgba(97,218,251,.08)}
    .video-note{margin-top:14px;color:var(--muted);font-size:.93rem}
    @media (max-width: 900px){.video-grid{grid-template-columns:1fr}}


.video-thumb{
  position:relative;display:block;aspect-ratio:16/9;overflow:hidden;background:#000;
}
.video-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s ease,opacity .2s ease}
.video-thumb:hover img{transform:scale(1.02);opacity:.88}
.video-play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.28);
  font-size:27px;color:#fff;line-height:1;padding-left:4px;
}
.video-thumb:hover .video-play{background:rgba(0,0,0,.88)}

    .collaborator-box {
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255,255,255,.02);
    }
    .collaborator-row {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(300px, 1.15fr);
      gap: 16px;
      align-items: center;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
    }
    .collaborator-row:first-child { border-top: 0; }
    .collaborator-main,
    .collaborator-keywords {
      line-height: 1.3;
      margin: 0;
    }
    .collaborator-main em {
      color: var(--muted);
      font-style: normal;
    }
    .collaborator-keywords {
      color: var(--muted);
    }
    #external-collaborators,
    #internal-collaborators {
      padding-top: 18px;
      padding-bottom: 4px;
    }
    #external-collaborators h2,
    #internal-collaborators h2 {
      margin-bottom: 10px;
    }
    @media (max-width: 760px) {
      .collaborator-row {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }

    .collaborator-section-box {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255,255,255,.025);
      padding: 16px 18px 6px;
    }

    .collaborator-section-box h2 {
      margin: 0 0 10px;
    }

    .collaborator-section-box .collaborator-box {
      border: 0;
      border-radius: 0;
      background: transparent;
      overflow: visible;
    }

    .collaborator-section-box .collaborator-row {
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }

    .collaborator-section-box .collaborator-row:first-child {
      border-top: 0;
    }

    #external-collaborators,
    #internal-collaborators {
      padding-top: 14px;
      padding-bottom: 2px;
    }

    #collaboration {
      padding-top: 30px;
      padding-bottom: 10px;
    }
    #collaboration > .container > h2 {
      margin-bottom: 18px;
    }
    .collaboration-subsection {
      margin-top: 16px;
    }
    .collaboration-subsection:first-of-type {
      margin-top: 0;
    }
    .collaboration-subsection .subsection-title {
      margin: 0 0 10px;
      font-size: 1.1rem;
    }
    .collaboration-list {
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255,255,255,.02);
    }
    .collaboration-row {
      display: grid;
      grid-template-columns: minmax(300px, 1.15fr) minmax(280px, 1fr);
      gap: 16px;
      align-items: center;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
    }
    .collaboration-row:first-child {
      border-top: 0;
    }
    .collaboration-person,
    .collaboration-keywords {
      line-height: 1.35;
    }
    .collaboration-person em {
      color: var(--muted);
      font-style: normal;
    }
    .collaboration-keywords {
      color: var(--muted);
    }
    @media (max-width: 760px) {
      .collaboration-row {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }

    /* Collaboration intentionally reuses the exact Members section structure/classes. */
    #collaboration .section-head,
    #collaboration .section-card,
    #collaboration .grid-3,
    #collaboration .member-card,
    #collaboration .member-card h3,
    #collaboration .member-card p,
    #collaboration .role {
      /* no custom overrides: inherit the same rules used by Members */
    }
    
    /* News feed */
    .news-stack { display:grid; gap:18px; }
    .news-title { margin:0 0 12px; font-size:1.35rem; }
    .news-copy p { margin:0 0 10px; }
    .news-hero {
      width:100%; max-height:520px; object-fit:cover; object-position:center 38%;
      display:block; border-radius:18px; border:1px solid var(--line); margin:14px 0 16px;
    }
    .featured-news { border-color:rgba(97,218,251,.2); }
    .news-gallery {
      display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:14px;
    }
    .news-gallery figure { margin:0; }
    .news-gallery img {
      width:100%; height:220px; object-fit:cover; border-radius:14px;
      border:1px solid var(--line); display:block;
    }
    .news-gallery figcaption { color:var(--muted); font-size:12px; margin-top:5px; }
    .news-related {
      margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
    }
    .news-related ul { margin:8px 0 0 18px; padding:0; }
    .news-related li { margin:6px 0; }
    @media (max-width:720px) {
      .news-gallery { grid-template-columns:1fr; }
      .news-gallery img { height:auto; max-height:340px; }
    }

    /* Compact news list */
    .news-list { display:grid; gap:12px; }
    .news-summary-card {
      padding:18px 20px; border:1px solid var(--line); border-radius:16px;
      background:var(--card);
    }
    .news-summary-card h3 { margin:5px 0 7px; font-size:1.08rem; }
    .news-summary-card h3 a { color:var(--text); text-decoration:none; }
    .news-summary-card h3 a:hover { text-decoration:underline; }
    .news-summary-card p { margin:0 0 8px; }
    .news-read-more, .news-all-link a { font-weight:600; text-decoration:none; }
    .news-read-more:hover, .news-all-link a:hover { text-decoration:underline; }
    .news-all-link { margin-top:14px; }


    /* Full news page */
    .pub-page-hero { padding: 64px 0 24px; }
    .news-stack { display:grid; gap:22px; }
    .news-card { scroll-margin-top: 90px; }
    .news-full-title { margin:6px 0 12px; font-size:1.55rem; }
    .news-hero { width:100%; max-height:560px; object-fit:cover; object-position:center 38%; display:block; border-radius:18px; border:1px solid var(--line); margin:14px 0 16px; }
    .news-copy p { margin:0 0 10px; }
    .news-gallery { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:14px; }
    .news-gallery figure { margin:0; }
    .news-gallery img { width:100%; height:260px; object-fit:cover; border-radius:14px; border:1px solid var(--line); display:block; }
    .news-gallery figcaption { color:var(--muted); font-size:12px; margin-top:5px; }
    .news-meta { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:15px; }
    .news-related { margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
    .news-related ul { margin:8px 0 0 18px; padding:0; }
    .news-related li { margin:6px 0; }
    @media (max-width:720px) { .news-gallery,.news-meta { grid-template-columns:1fr; } .news-gallery img { height:auto; max-height:360px; } }
</style>
</head>

  <div class="wrap">
    <span class="eyebrow">GSAI · UFSC</span>
    <h1>News</h1>
    <p class="lead">Activities, projects, events, and research highlights from the group.</p>
    <div class="hero-actions">
      <a class="btn secondary" href="index.html#news">Back to GSAI</a>
    </div>
  </div>
</header>

<main class="wrap">
  <section>
    <div id="all-news-content"></div>
  </section>
</main>

<div class="footer">
  <div class="wrap">GSAI · Grupo de Sistemas Autônomos Inteligentes · UFSC</div>
</div>

</body>
