name: Fetch UFSC logo for preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-ufsc-logo.yml'

permissions:
  contents: write

jobs:
  fetch-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official UFSC logo
        run: |
          mkdir -p preview/images/logos
          curl -L --fail --retry 3             'https://inteligencia-artificial.ufsc.br/wp-content/themes/brasilGovInterno/img/brasao_default.png'             -o preview/images/logos/ufsc-brasao.png
          file preview/images/logos/ufsc-brasao.png
      - name: Point preview to local logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('preview/shared-nav.js')
          s=p.read_text()
          s=s.replace('https://inteligencia-artificial.ufsc.br/wp-content/themes/brasilGovInterno/img/brasao_default.png','images/logos/ufsc-brasao.png')
          p.write_text(s)
          PY
      - name: Commit downloaded logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/images/logos/ufsc-brasao.png preview/shared-nav.js
          git diff --cached --quiet || git commit -m "Store official UFSC logo locally for preview"
          git push
